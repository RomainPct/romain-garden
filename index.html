<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Romain's Garden</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <romain-garden-nav current="garden"></romain-garden-nav>
    </header>

    <main>
      <h1 class="rgn-text-large-title">Component lab</h1>
      <p class="rgn-text-body">
        sticker-icon, garden-card, and section-title — using DS tokens.
      </p>

      <section class="lab">
        <h2 class="rgn-text-title">Garden card</h2>
        <garden-card
          title="Garden"
          subtitle="The home for all this stuff"
          href="https://romain.garden"
          icon="/assets/Icon/BenchmarkLibrary.png"
        ></garden-card>
      </section>

      <section class="lab">
        <h2 class="rgn-text-title">Section title</h2>
        <section-title
          content="But try to catch all the stickers"
          icon-1="/assets/Icon/BenchmarkLibrary.png"
          icon-2="/assets/Icon/Apps.png"
          icon-3="/assets/Icon/ai-sticker.png"
        ></section-title>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
